worker_processes 1;
error_log /tmp/nginx-error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /tmp/nginx-access.log;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    default_type application/json;
    sendfile on;

    server {
        listen 7860;
        server_name _;

        # The browser never calls this port directly in the hosted demo.
        # Vercel adds X-API-KEY and this proxy forwards that header.
        location /api/v1/stream {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-API-KEY $http_x_api_key;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-API-KEY $http_x_api_key;
            proxy_set_header X-Request-ID $request_id;
        }

        location /processor/stream {
            proxy_pass http://127.0.0.1:8080/stream;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no;
        }

        location /processor/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
        }

        location /simulator/ {
            proxy_pass http://127.0.0.1:8082/;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
        }

        location = / {
            default_type application/json;
            return 200 '{"service":"smarttoll","hint":"The console is the Vercel app. This port is the API."}';
        }
    }
}
