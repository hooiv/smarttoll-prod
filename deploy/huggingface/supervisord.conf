[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:billing]
directory=/home/user/app/billing_service
command=/bin/sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
environment=PYTHONPATH="/home/user/app/billing_service",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=30
priority=20
stdout_logfile=/tmp/billing.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/billing.log
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:processor]
directory=/home/user/app/toll_processor
command=python app/main.py
environment=PYTHONPATH="/home/user/app/toll_processor",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=30
priority=20
stdout_logfile=/tmp/processor.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/processor.log
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:simulator]
directory=/home/user/app/obu_simulator
command=python obu_simulator.py
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=3
startretries=30
priority=30
stdout_logfile=/tmp/simulator.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/simulator.log
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:nginx]
command=/usr/sbin/nginx -c /home/user/app/deploy/huggingface/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
priority=10
stdout_logfile=/tmp/nginx.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/nginx.log
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
