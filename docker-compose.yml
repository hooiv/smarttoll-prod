# Define environment variables from .env file for substitution below
# Note: Service-specific env vars are better set in their 'environment' or 'env_file' sections
# x-variables: &env_vars
#  POSTGRES_DB: ${POSTGRES_DB:-smarttoll}
#  POSTGRES_USER: ${POSTGRES_USER:-user}
#  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}

services:
  # --- Kafka Ecosystem ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: smarttoll_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Disable JVM container-detection to avoid NullPointerException on cgroup v2 kernels
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseG1GC -XX:-UseContainerSupport"
    networks:
      - smarttoll_net
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "30"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: smarttoll_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # Port for clients outside docker network (your machine)
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      # Listener for clients inside the docker network (other services)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
      # How clients can reach Kafka. INTERNAL for broker-to-broker and service-to-broker communication.
      # Use 'kafka:29092' internally. Use 'localhost:9092' externally.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Sensible defaults for single-node setup
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 100 # Give consumers time to join
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1 # Confluent specific
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1 # Confluent specific
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # Auto create topics for development (DISABLE in production)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Disable JVM container-detection to avoid NullPointerException on cgroup v2 kernels
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseG1GC -XX:-UseContainerSupport"
    networks:
      - smarttoll_net
    healthcheck:
      test: ["CMD", "cub", "kafka-ready", "-b", "kafka:29092", "1", "10"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s

  # --- Core Infrastructure ---
  redis:
    image: redis:7.0-alpine
    container_name: smarttoll_redis
    ports:
      - "6379:6379"
    networks:
      - smarttoll_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgis/postgis:15-3.3
    container_name: smarttoll_db
    env_file:
      - .env # Load PG user/pass/db from .env
    # environment: # Use env_file instead for sensitive values
    #   <<: *env_vars
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: Mount init script directory if you have one
      # - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - smarttoll_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost"] # Use $$ to escape $ for shell
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Application Services ---
  obu_simulator:
    build:
      context: ./obu_simulator
    container_name: smarttoll_simulator
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: DEBUG
      # Override Kafka broker if needed, default uses internal listener
      KAFKA_BROKER: kafka:29092
      SIM_HEALTH_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - smarttoll_net
    restart: unless-stopped # Keep simulator running
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  toll_processor:
    build:
      context: ./toll_processor
      dockerfile: Dockerfile
    container_name: smarttoll_processor
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      # Set internal service names for dependencies
      KAFKA_BROKER: kafka:29092
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      # Host URLs documented in the README (liveness + Prometheus)
      - "8080:8080"
      - "8081:8081"
    networks:
      - smarttoll_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  billing_service:
    build:
      context: ./billing_service
      dockerfile: Dockerfile
    container_name: smarttoll_billing
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      # Set internal service names for dependencies
      KAFKA_BROKER: kafka:29092
      POSTGRES_HOST: postgres
      # Define how the API binds inside the container
      BIND_HOST: 0.0.0.0
      BIND_PORT: 8000
      LOG_LEVEL: DEBUG
      # mock = deterministic local charges. stripe = test-mode only, off unless configured.
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-mock}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      MOCK_PAYMENT_FAIL_RATE: ${MOCK_PAYMENT_FAIL_RATE:-0.0}
      MOCK_PAYMENT_TIMEOUT_RATE: ${MOCK_PAYMENT_TIMEOUT_RATE:-0.0}
    ports:
      # Map internal port 8000 to host port 8001
      - "8001:8000"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - smarttoll_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smarttoll_frontend
    environment:
      # nginx injects this key when proxying /api. The browser never sees it.
      BILLING_UPSTREAM: http://billing_service:8000
      BILLING_API_KEY: ${SERVICE_API_KEY:-supersecretapikey123}
    ports:
      # The unprivileged image cannot bind port 80. Host 3000 still reaches it.
      - "3000:8080"
    depends_on:
      billing_service:
        condition: service_healthy
    networks:
      - smarttoll_net
    restart: unless-stopped
    healthcheck:
      # Alpine wget resolves "localhost" to ::1 first; probe IPv4 directly.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: smarttoll_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - smarttoll_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:11.4.0
    container_name: smarttoll_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/smarttoll.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - smarttoll_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    driver: local # Default docker volume driver

networks:
  smarttoll_net:
    driver: bridge
