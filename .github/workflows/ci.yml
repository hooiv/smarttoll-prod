name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r billing_service/requirements.txt \
            -r billing_service/requirements-dev.txt \
            -r toll_processor/requirements.txt \
            -r toll_processor/requirements-dev.txt \
            -r obu_simulator/requirements.txt \
            -r requirements-dev.txt
      - name: Lint
        run: flake8 billing_service/app toll_processor/app obu_simulator scripts
      - name: Billing unit tests
        working-directory: billing_service
        run: python -m pytest tests/ -q --tb=short
      - name: Toll processor unit tests
        working-directory: toll_processor
        run: python -m pytest tests/ -q --tb=short
      - name: Simulator trace length
        working-directory: obu_simulator
        run: python -m pytest tests/ -q --tb=short

  integration:
    name: Integration test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Start the integration stack
        run: docker compose -f tests/integration/docker-compose.integration.yml up -d --build --wait
      - name: Run the end-to-end test
        run: python -m pytest tests/integration/ -q --tb=short
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f tests/integration/docker-compose.integration.yml logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f tests/integration/docker-compose.integration.yml down --remove-orphans

  images:
    name: Image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Provide the env file Compose expects
        run: cp .env.example .env
      - name: Build service images
        run: docker compose build
